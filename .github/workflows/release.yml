name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/bambu_printer_webhook/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          manifest=$(jq -r .version custom_components/bambu_printer_webhook/manifest.json)
          constant=$(sed -n 's/^VERSION: Final = "\(.*\)"$/\1/p' custom_components/bambu_printer_webhook/const.py)
          if [ "$manifest" != "$constant" ]; then
            echo "::error::manifest.json says $manifest, const.py says $constant: they must match."
            exit 1
          fi
          echo "tag=v$manifest" >> "$GITHUB_OUTPUT"
      - name: Create the release, unless it exists
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
